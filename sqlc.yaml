version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: internal/repository/postgres/sqlc
        sql_package: pgx/v5
        emit_db_tags: false
        emit_empty_slices: true
        emit_interface: false
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: false
