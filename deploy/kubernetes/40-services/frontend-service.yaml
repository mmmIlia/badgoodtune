apiVersion: v1
kind: Service
metadata:
  name: badgoodtune-frontend
  namespace: badgoodtune
  labels:
    app.kubernetes.io/name: badgoodtune
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: badgoodtune
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
