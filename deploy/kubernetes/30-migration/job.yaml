apiVersion: batch/v1
kind: Job
metadata:
  name: badgoodtune-migration
  namespace: badgoodtune
  labels:
    app.kubernetes.io/name: badgoodtune
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: badgoodtune
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: badgoodtune-backend:local
          imagePullPolicy: Never
          command:
            - /app/migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: badgoodtune-secret
                  key: DATABASE_URL
            - name: DATABASE_CONNECT_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: badgoodtune-config
                  key: DATABASE_CONNECT_TIMEOUT
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
