apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - blackbox-deployment.yaml
  - evaluator-deployment.yaml
  - services.yaml
configMapGenerator:
  - name: blackbox-config
    files:
      - blackbox.yaml
  - name: reliability-rules
    files:
      - rules.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: badgoodtune-reliability
    includeTemplates: true
