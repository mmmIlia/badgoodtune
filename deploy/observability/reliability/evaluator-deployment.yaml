apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliability-evaluator
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: reliability-evaluator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reliability-evaluator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.154.0
          args:
            - -rule=/etc/reliability/rules.yaml
            - -datasource.url=http://victoria-metrics.observability.svc.cluster.local:8428
            - -remoteWrite.url=http://victoria-metrics.observability.svc.cluster.local:8428
            - -rule.evalDelay=0s
            - -loggerFormat=json
            - -httpListenAddr=:8880
          ports:
            - name: http
              containerPort: 8880
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 150m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: rules
              mountPath: /etc/reliability
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: reliability-rules
