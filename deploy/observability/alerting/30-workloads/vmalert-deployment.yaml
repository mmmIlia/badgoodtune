apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: observability
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/component: alert-evaluator
    app.kubernetes.io/part-of: badgoodtune-observability
    app.kubernetes.io/version: 1.153.0
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
      app.kubernetes.io/component: alert-evaluator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
        app.kubernetes.io/component: alert-evaluator
        app.kubernetes.io/part-of: badgoodtune-observability
        app.kubernetes.io/version: 1.153.0
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.153.0
          imagePullPolicy: IfNotPresent
          args:
            - -rule=/etc/vmalert/rules/*.yaml
            - -rule.defaultRuleType=vlogs
            - -rule.evalDelay=2s
            - -rule.stripFilePath
            - -datasource.url=http://victoria-logs.observability.svc.cluster.local:9428
            - -notifier.url=http://alertmanager.observability.svc.cluster.local:9093
            - -external.label=cluster=minikube
            - -httpListenAddr=:8880
            - -loggerFormat=json
          ports:
            - name: http
              containerPort: 8880
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
      terminationGracePeriodSeconds: 15
