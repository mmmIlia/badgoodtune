apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/part-of: badgoodtune-observability
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 1m

    route:
      receiver: homework-blackhole
      group_by:
        - alertname
        - service
      group_wait: 1s
      group_interval: 30s
      repeat_interval: 1h

    receivers:
      - name: homework-blackhole
