apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-exporter-bootstrap
  namespace: badgoodtune
  labels:
    app.kubernetes.io/name: badgoodtune
    app.kubernetes.io/component: postgres-exporter
spec:
  activeDeadlineSeconds: 90
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: badgoodtune
        app.kubernetes.io/component: postgres-exporter-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          command: [psql, -X, --no-password, --set=ON_ERROR_STOP=1, --file=/bootstrap/monitor.sql]
          env:
            - name: PGHOST
              value: postgres
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: badgoodtune-config
                  key: POSTGRES_DB
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: badgoodtune-config
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: badgoodtune-config
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: badgoodtune-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-secret
                  key: POSTGRES_EXPORTER_PASSWORD
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: bootstrap
          configMap:
            name: postgres-exporter-bootstrap
