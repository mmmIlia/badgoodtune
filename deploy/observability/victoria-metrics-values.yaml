rbac:
  create: false

serviceAccount:
  create: true
  name: victoria-metrics

server:
  fullnameOverride: victoria-metrics
  image:
    tag: v1.154.0
  retentionPeriod: 35d
  persistentVolume:
    storageClassName: standard
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  podSecurityContext:
    enabled: true
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  extraArgs:
    loggerFormat: json
    storage.minFreeDiskSpaceBytes: 100MiB
    promscrape.configCheckInterval: 15s
  scrape:
    enabled: true
    config:
      global:
        scrape_interval: 15s
        scrape_timeout: 5s
      scrape_configs:
        - job_name: victoria-metrics
          static_configs:
            - targets: [localhost:8428]
        - job_name: badgoodtune-probe
          scrape_interval: 5s
          scrape_timeout: 4s
          metrics_path: /probe
          params:
            module: [catalog]
          static_configs:
            - targets:
                - http://badgoodtune-frontend.badgoodtune.svc.cluster.local/api/v1/albums?pageSize=1
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: blackbox-exporter.observability.svc.cluster.local:9115
        - job_name: application-pods
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [badgoodtune]
          relabel_configs:
            - action: keep
              source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              regex: "true"
            - action: drop
              source_labels: [__meta_kubernetes_pod_container_init]
              regex: "true"
            - action: keep
              source_labels: [__meta_kubernetes_pod_phase]
              regex: Running
            - action: keep_if_equal
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_port
                - __meta_kubernetes_pod_container_port_number
            - action: keep
              source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
              regex: backend|postgres-exporter
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              regex: (.+)
              target_label: __metrics_path__
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
              regex: backend
              target_label: job
              replacement: badgoodtune-backend
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
              regex: postgres-exporter
              target_label: job
              replacement: postgres
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod

extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: victoria-metrics-discovery
      namespace: badgoodtune
    rules:
      - apiGroups: [""]
        resources: [pods]
        verbs: [get, list, watch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: victoria-metrics-discovery
      namespace: badgoodtune
    subjects:
      - kind: ServiceAccount
        name: victoria-metrics
        namespace: observability
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: victoria-metrics-discovery
