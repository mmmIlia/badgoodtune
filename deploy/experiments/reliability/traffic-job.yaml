apiVersion: batch/v1
kind: Job
metadata:
  name: reliability-traffic
  namespace: badgoodtune
  labels:
    app.kubernetes.io/part-of: badgoodtune-reliability-experiment
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: badgoodtune-reliability-experiment
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic
          image: curlimages/curl:8.23.0
          command: [sh, -ec]
          args:
            - |
              while :; do
                curl --connect-timeout 1 --max-time 4 --silent --show-error \
                  --output /dev/null --write-out 'status=%{http_code} duration=%{time_total}\n' \
                  'http://badgoodtune-frontend/api/v1/albums?pageSize=1' || true
                sleep 1
              done
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
